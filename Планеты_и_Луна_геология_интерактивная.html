 жидкое внешнее Fe-содержащее ядро → твёрдое внутреннее ядро.", "geology": "Тектоника плит, образование гор, землетрясения, вулканизм и круговорот горных пород.", "method": "Сейсмические волны выявляют границы слоёв; образцы пород уточняют минералогию.", "fact": "Земля — эталон для сравнения геологических процессов на других планетах.", "layers": [["Кора: силикатные породы", "#60a9b6"], ["Мантия: Mg–Fe-силикаты", "#dc7648"], ["Внешнее ядро: жидкое Fe", "#f0b85e"], ["Внутреннее ядро: твёрдое Fe", "#fff0af"]], "weights": [0.07, 0.47, 0.3, 0.16], "palette": ["#144582", "#238aaf", "#5ea457"], "kind": "earth", "densityValue": 5.51}, {"name": "Луна", "en": "MOON", "group": "ЕСТЕСТВЕННЫЙ СПУТНИК ЗЕМЛИ", "density": "3,34", "composition": "Светлые материки богаты анортозитами (плагиоклаз, Ca–Al); тёмные лунные моря сложены базальтами с Fe и Mg. Реголит — обломки пород и стекло.", "interior": "Кора (в среднем десятки километров) → преимущественно твёрдая силикатная мантия (оливин, пироксен) → небольшое ядро, богатое железом, с жидкой внешней и твёрдой внутренней частями (по моделям).", "geology": "Древние лавовые излияния образовали лунные моря. Ударные кратеры, брекчии и реголит сохраняют следы столкновений. Современной тектоники плит нет.", "method": "«Аполлон» и «Луна»: образцы грунта; сейсмометры Apollo: лунотрясения; GRAIL: гравитационное поле; LRO: рельеф.", "fact": "Средняя плотность Луны ниже земной: это согласуется с намного меньшей долей металлического ядра. Лунная кора на дальней стороне в среднем толще.", "layers": [["Кора: анортозиты, базальты", "#bcbfbe"], ["Мантия: оливин и пироксен", "#947f68"], ["Внешнее ядро: железо, жидкая фаза", "#d2a169"], ["Внутреннее ядро: железо, твёрдая фаза", "#eed298"]], "weights": [0.08, 0.73, 0.12, 0.07], "palette": ["#8c9094", "#afb0a8", "#60646a"], "kind": "moon", "densityValue": 3.34}, {"name": "Марс", "en": "MARS", "group": "ПЛАНЕТА ЗЕМНОЙ ГРУППЫ", "density": "3,93", "composition": "Поверхность преимущественно базальтовая; красная пыль содержит оксиды железа. Мантия богата силикатами.", "interior": "Каменистая кора → силикатная мантия → Fe–Ni-ядро с лёгкими примесями, в том числе серой. Детали границ уточняются.", "geology": "Вулкан Олимп, гигантские каньоны, древние русла и озёрные отложения — следы длительной геологической истории.", "method": "InSight: марсотрясения и прохождение сейсмических волн через недра.", "fact": "Сейсмология Марса помогает сопоставлять строение двух каменистых планет.", "layers": [["Кора: базальтовые породы", "#ad5537"], ["Мантия: силикаты", "#d5814a"], ["Ядро: Fe–Ni, S и примеси", "#edbf77"]], "weights": [0.14, 0.49, 0.37], "palette": ["#9c432c", "#de8956", "#6c3025"], "kind": "rock", "densityValue": 3.93}, {"name": "Юпитер", "en": "JUPITER", "group": "ГАЗОВЫЙ ГИГАНТ", "density": "1,33", "composition": "Основная масса — водород и гелий; тяжёлые элементы присутствуют в глубинных областях и атмосферных соединениях.", "interior": "Облачный слой → всё более плотный H₂–He → электропроводящий металлический водород → размытая область, обогащённая тяжёлыми элементами.", "geology": "Твёрдой поверхности нет. Для планетной геофизики важны распределение плотности, давление, фазовые переходы и устройство ядра.", "method": "Juno: гравитационное и магнитное поля; модели распределения массы.", "fact": "Границы между слоями условны: вещество изменяется с глубиной постепенно.", "layers": [["Оболочка: H₂ и He", "#d9b695"], ["Глубже: плотный H₂–He", "#c79770"], ["Металлический водород", "#9bb8c1"], ["Размытая область тяжёлых элементов", "#e5c178"]], "weights": [0.18, 0.25, 0.4, 0.17], "palette": ["#c4a484", "#f0d4aa", "#a96c54"], "kind": "gas", "densityValue": 1.33}, {"name": "Сатурн", "en": "SATURN", "group": "ГАЗОВЫЙ ГИГАНТ", "density": "0,69", "composition": "Водород и гелий преобладают; центральные области обогащены более тяжёлыми веществами.", "interior": "Атмосфера H₂–He → плотная флюидная оболочка → область металлического водорода → центральная область тяжёлых элементов (модель).", "geology": "Твёрдой поверхности нет. Важны внутреннее расслоение, фазовые превращения, тепловой поток и плотность.", "method": "Cassini: гравитационные измерения и наблюдения колебаний колец.", "fact": "Средняя плотность меньше плотности воды — наглядный показатель высокой доли лёгких веществ.", "layers": [["Атмосфера: H₂ и He", "#e2ca95"], ["Плотный водород и гелий", "#bdb4a0"], ["Металлический водород", "#a1adb8"], ["Тяжёлые элементы в глубине", "#dbb26e"]], "weights": [0.19, 0.36, 0.3, 0.15], "palette": ["#d2b689", "#e7d6b1", "#a88d6c"], "kind": "saturn", "densityValue": 0.69}, {"name": "Уран", "en": "URANUS", "group": "ЛЕДЯНОЙ ГИГАНТ", "density": "1,27", "composition": "Атмосфера: H₂, He и CH₄. В недрах предполагается значительная доля H₂O, NH₃, CH₄ и тяжёлых компонентов.", "interior": "Внешняя газовая оболочка → горячая плотная смесь водородных соединений → более тяжёлые центральные области. Резкость границ неизвестна.", "geology": "«Лёд» в названии — термин состава, а не доказательство обычного замёрзшего льда внутри планеты.", "method": "Voyager 2: магнитное поле и параметры планеты; современные модели гравитации и состава.", "fact": "Экстремальные давление и температура могут создавать необычные состояния вещества.", "layers": [["Атмосфера: H₂, He, CH₄", "#a6dcda"], ["Горячая плотная смесь H₂O, NH₃, CH₄", "#6d97b8"], ["Тяжёлые центральные компоненты", "#d7b17e"]], "weights": [0.23, 0.57, 0.2], "palette": ["#81c7c8", "#b5e0df", "#569bab"], "kind": "ice", "densityValue": 1.27}, {"name": "Нептун", "en": "NEPTUNE", "group": "ЛЕДЯНОЙ ГИГАНТ", "density": "1,64", "composition": "Наружная оболочка: H₂, He и CH₄. Глубже ожидаются плотные соединения воды, аммиака, метана и каменистые компоненты.", "interior": "Атмосфера → плотные горячие глубинные смеси → область, обогащённая тяжёлыми веществами. Точная структура неизвестна.", "geology": "Среди гигантов обладает наибольшей средней плотностью: это указывает на существенную долю тяжёлых веществ.", "method": "Voyager 2: магнитное поле и атмосфера; по косвенным измерениям строят модели недр.", "fact": "Цвет на иллюстрации стилизован: реальные оттенки Урана и Нептуна ближе друг к другу, чем на многих старых снимках.", "layers": [["Атмосфера: H₂, He, CH₄", "#7aaac3"], ["Плотные смеси H₂O, NH₃, CH₄", "#5079a7"], ["Тяжёлые центральные компоненты", "#cca774"]], "weights": [0.22, 0.58, 0.2], "palette": ["#416eac", "#7faed4", "#32568a"], "kind": "ice", "densityValue": 1.64}];

}else if(p.type==='intro')s.innerHTML=`<div class="slideFull"><div class="kicker">ПРОЕКТ ПО ГЕОЛОГИИ · 6 УЧАСТНИКОВ</div><h1 class="heroTitle">Геологическое строение<br>планет и Луны</h1><div class="heroBody">Из каких минералов и химических элементов состоят планеты и Луна? Как устроены кора, мантия и ядро, и откуда мы это знаем?</div><div class="chips"><span class="chip">04 каменистые планеты</span><span class="chip">01 спутник — Луна</span><span class="chip">02 газовые гиганты</span><span class="chip">02 ледяные гиганты</span></div><div class="callout">Планеты сформировались около 4,6 млрд лет назад из газопылевого диска. Луна образовалась вскоре после Земли, вероятно после гигантского столкновения. Сравним их породы, плотность и строение недр.</div><div class="tiny">Нажмите →, чтобы перейти к Меркурию; нажимайте на планеты и Луну, чтобы видеть модели разрезов.</div></div>`;
else if(p.type==='summary')s.innerHTML=`<div class="slideFull"><div class="kicker">ОБЩИЙ ГЕОЛОГИЧЕСКИЙ ВЫВОД</div><h1 class="heroTitle">Почему небесные тела<br>такие разные?</h1><div class="comparison"><div class="comparebox"><h2>Каменистые</h2><p>Меркурий, Венера, Земля и Марс имеют силикатные оболочки и металлические ядра. Плотность: <b>3,93–5,51 г/см³</b>. Луна тоже имеет слоистые недра, но меньшее ядро и плотность <b>3,34 г/см³</b>.</p></div><div class="comparebox"><h2>Газовые гиганты</h2><p>Юпитер и Сатурн состоят в основном из H₂ и He. Под огромным давлением формируется электропроводящий водород. <b>Твёрдой поверхности нет.</b></p></div><div class="comparebox"><h2>Ледяные гиганты</h2><p>Уран и Нептун содержат более значительную долю тяжёлых веществ, в том числе соединений H₂O, NH₃ и CH₄. Внутренние слои изучены косвенно.</p></div></div><p class="callout">Средняя плотность указывает на различия в составе, но сама по себе не раскрывает строение недр. Нужны измерения гравитации, магнитного поля, сейсмические данные и физические модели.</p></div>`;
else s.innerHTML=`<div class="slideFull"><div class="kicker">НАУЧНАЯ ОСНОВА</div><h1 class="heroTitle">Методы и источники</h1><div class="source"><p><b>NASA / JPL — Planetary Fact Sheet:</b> численные значения средней плотности. <a href="https://nssdc.gsfc.nasa.gov/planetary/factsheet/" target="_blank">nssdc.gsfc.nasa.gov/planetary/factsheet</a></p><p><b>NASA — Moon Composition &amp; Structure:</b> состав лунных пород, кора, мантия и ядро; сейсмометры Apollo и GRAIL. <a href="https://science.nasa.gov/moon/composition/" target="_blank">science.nasa.gov/moon/composition</a></p><p><b>NASA — Jupiter Facts:</b> металлический водород, данные Juno и размытое ядро. <a href="https://science.nasa.gov/jupiter/jupiter-facts/" target="_blank">science.nasa.gov/jupiter/jupiter-facts</a></p><p><b>National Academies (2023–2032):</b> неопределённости в моделях недр газовых и ледяных гигантов. <a href="https://www.nationalacademies.org/read/26522/chapter/12" target="_blank">nationalacademies.org/read/26522/chapter/12</a></p><p><b>NASA:</b> миссии MESSENGER, Magellan, InSight, Cassini, Voyager 2 и Juno.</p></div><div class="notebox">Разрезы — учебные схемы. Цвета и толщины слоёв условны; в особенности у гигантов действительное распределение вещества может быть плавным. Спасибо за внимание!</div></div>`;
root.appendChild(s);all.push(s);let b=elt('button','tab');b.setAttribute('aria-label','Слайд '+(i+1));b.addEventListener('click',()=>go(i));tabs.appendChild(b) });
function toggle(i){cut[i]=!cut[i];let l=document.getElementById('legend'+i);l.classList.toggle('open',cut[i]);}
function go(i){active=Math.max(0,Math.min(slides.length-1,i));all.forEach((s,j)=>s.classList.toggle('active',j===active));[...tabs.children].forEach((x,j)=>x.classList.toggle('active',j===active));document.getElementById('progress').textContent=String(active+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0')+'   ·   '+(slides[active].name||'Геологический проект');document.getElementById('prev').disabled=active===0;document.getElementById('next').disabled=active===slides.length-1;location.hash='slide-'+(active+1)}
document.getElementById('prev').onclick=()=>go(active-1);document.getElementById('next').onclick=()=>go(active+1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.getElementById('help').onclick=()=>alert('Стрелки ← и → — переключение слайдов. Enter или пробел на выбранной планете — показать разрез. Нажмите на планету или Луну мышкой или пальцем. Кнопка ⛶ — полноэкранный режим. Работает без интернета.');window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(active+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(active-1)}});
// Canvas illustrations: procedural stylized spheres; use smooth shaded material with moving patterns.
function rgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shadePoint(x,y,p,t){let latitude=Math.asin(y),longitude=Math.atan2(x,Math.sqrt(Math.max(0,1-x*x-y*y)))+t;let w=Math.sin(17*latitude+2*Math.sin(4*longitude))+0.5*Math.sin(31*latitude+longitude*9);let n=Math.sin(19*longitude+11*latitude)*Math.cos(21*latitude-6*longitude);let c;
if(p.kind==='earth'){let land=Math.sin(longitude*2.6+2*Math.sin(latitude*3))+Math.cos(latitude*5+longitude*3)*.43+n*.24;if(land>.16)c=land>.55?'#75a66b':'#3f875b';else c= w>.5?'#2e82ba':'#16416e';if(Math.abs(latitude)>1.20)c='#d6e9e2';}
else if(p.kind==='moon'){let crater=Math.sin(20*longitude+7*latitude)*Math.cos(17*latitude-4*longitude)+.37*Math.sin(42*longitude-35*latitude);let maria=Math.sin(2.8*longitude+1.7*Math.sin(latitude*3))+Math.cos(3.5*latitude-2*longitude)*.48;c=maria>.47?p.palette[2]:(crater>.24?p.palette[1]:p.palette[0]);}
else if(p.kind==='gas'||p.kind==='saturn'){let z=Math.sin(latitude*34+2*Math.sin(longitude*5))+.5*Math.sin(latitude*67)+n*.18; c=z>.6?p.palette[1]:z<-.5?p.palette[2]:p.palette[0];}
else if(p.kind==='ice'){let z=.4*Math.sin(19*latitude+longitude*2)+n*.3;c=z>.45?p.palette[1]:z<-.35?p.palette[2]:p.palette[0]}
else {let crater=Math.sin(14*longitude)*Math.sin(15*latitude)+Math.sin(26*longitude-19*latitude)*.32;c=crater>.28?p.palette[1]:crater<-.4?p.palette[2]:p.palette[0]}
return rgb(c)}
function drawPlanet(canvas,p,opened,t){const ctx=canvas.getContext('2d');let W=520,H=520, cx=260,cy=256,r=192;ctx.clearRect(0,0,W,H);
if(p.kind==='saturn'){ctx.save();ctx.translate(cx,cy);ctx.rotate(-.25);ctx.scale(1,.27);ctx.strokeStyle='#bdac8e8f';ctx.lineWidth=21;ctx.beginPath();ctx.ellipse(0,0,247,239,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#e1cda9b0';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(0,0,271,258,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
let size=220,temp=document.createElement('canvas');temp.width=size;temp.height=size;let ct=temp.getContext('2d'),im=ct.createImageData(size,size),a=im.data;for(let j=0;j<size;j++)for(let i=0;i<size;i++){let x=(i-size/2)/(size/2),y=(j-size/2)/(size/2),rr=x*x+y*y;if(rr>=1)continue;let z=Math.sqrt(1-rr),light=Math.max(.22,.40+.6*(.54*x-.30*y+.73*z)),cols=shadePoint(x,y,p,t);let o=(j*size+i)*4;let edge=Math.min(1,Math.max(0,(1-Math.sqrt(rr))*22));for(let k=0;k<3;k++)a[o+k]=Math.min(255,cols[k]*light);a[o+3]=edge*255}ct.putImageData(im,0,0);ctx.drawImage(temp,cx-r,cy-r,r*2,r*2);
if(opened){ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,-.62,.69,false);ctx.closePath();ctx.fillStyle='#08121f';ctx.fill();ctx.clip();let acc=r;for(let i=0;i<p.layers.length;i++){let outer=acc;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,outer,-.62,.69);ctx.closePath();ctx.fillStyle=p.layers[i][1];ctx.fill();let sep=Math.max(7,r*p.weights[i]);acc-=sep}ctx.restore();ctx.strokeStyle='#dbf8ed';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(-.62),cy+r*Math.sin(-.62));ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(.69),cy+r*Math.sin(.69));ctx.stroke();ctx.fillStyle='#f6e0a1';ctx.beginPath();ctx.arc(cx,cy,13,0,Math.PI*2);ctx.fill()}
if(p.kind==='saturn'){ctx.save();ctx.translate(cx,cy);ctx.rotate(-.25);ctx.scale(1,.27);ctx.beginPath();ctx.ellipse(0,0,247,239,0,0,Math.PI);ctx.strokeStyle='#e7d8afdd';ctx.lineWidth=24;ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,270,258,0,0,Math.PI);ctx.strokeStyle='#f6e6b9a8';ctx.lineWidth=8;ctx.stroke();ctx.restore()}
}
let last=0;function frame(ms){if(ms-last>130){last=ms;phase+=.013;let p=slides[active];if(p&&p.type==='planet'){let canvas=all[active].querySelector('canvas');drawPlanet(canvas,p,Boolean(cut[active]),phase)}}requestAnimationFrame(frame)}go(Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.replace('#slide-',''))||1)-1)));requestAnimationFrame(frame);
